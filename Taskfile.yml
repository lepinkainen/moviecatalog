version: '3'

vars:
  APP_NAME: moviecatalog
  BUILD_DIR: build

tasks:
  build:
    desc: Run lint and tests, build the frontend, then build the binary into build/
    cmds:
      - task: web-build
      - task: lint
      - task: test
      - mkdir -p {{.BUILD_DIR}}
      - go build -o {{.BUILD_DIR}}/{{.APP_NAME}} .

  build-linux:
    desc: Build the Linux binary into build/
    deps: [web-build]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o {{.BUILD_DIR}}/{{.APP_NAME}}-linux-amd64 .

  export:
    desc: Write the read-only library site into site/ (flags after --, e.g. task export -- --title="My discs"; series need TMDB_API_KEY)
    deps: [web-build]
    cmds:
      - go run . export {{.CLI_ARGS}}

  export-op:
    desc: Like export, with TMDB_API_KEY resolved from 1Password (op.env)
    deps: [web-build]
    cmds:
      - op run --env-file=op.env -- go run . export {{.CLI_ARGS}}

  publish:
    desc: Export with link previews and series lists, upload to PUBLISH_HOST (optional PUBLISH_URL in op.env); flags go after --
    deps: [web-build]
    cmds:
      - |
        op run --env-file=op.env -- sh -c '
          set -e
          : "${PUBLISH_HOST:?PUBLISH_HOST is not set in op.env}"
          go run . export --output=site/ {{.CLI_ARGS}}
          rsync -avz --delete site/ "$PUBLISH_HOST:/opt/data/caddy/site/movies/"
        '

  backup:
    desc: Zip the database (a consistent snapshot) and original photos into backups/, with the sqlite3 and zip CLIs
    cmds:
      - |
        set -eu
        data="${MOVIECATALOG_DATA_DIR:-data}"
        # sqlite3 would create an empty database at a wrong path.
        test -f "$data/moviecatalog.db" || { echo "no catalogue at $data/moviecatalog.db" >&2; exit 1; }
        mkdir -p backups
        out="$PWD/backups/moviecatalog-$(date +%Y%m%d-%H%M%S).zip"
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        # VACUUM INTO folds the WAL into one self-contained file; copying the .db alone would miss recent writes.
        sqlite3 -init /dev/null "$data/moviecatalog.db" "VACUUM INTO '$work/moviecatalog.db'"
        (cd "$work" && zip -q -9 backup.zip moviecatalog.db)
        # JPEGs don't compress further, so store them as they are.
        (cd "$data" && zip -q -r -0 "$work/backup.zip" images)
        mv "$work/backup.zip" "$out"
        echo "$out"

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  lint:
    desc: Run go vet and the frontend type check
    cmds:
      - go vet ./...
      - npm --prefix web run check

  dev:
    desc: Run the Go server with automatic rebuild and restart on changes (air, API on :8080)
    cmds:
      - mise exec -- air

  dev-op:
    desc: Like dev, with API keys resolved from 1Password (op.env) once at start
    cmds:
      - op run --env-file=op.env -- mise exec -- air

  web-install:
    desc: Install frontend dependencies
    cmds:
      - npm --prefix web install
    sources:
      - web/package.json
      - web/package-lock.json
    generates:
      - web/node_modules/.package-lock.json

  web-dev:
    desc: Run the Vite dev server with live reload (proxies /api to :8080)
    deps: [web-install]
    cmds:
      - npm --prefix web run dev

  web-build:
    desc: Build the frontend into internal/webui/dist for embedding
    deps: [web-install]
    cmds:
      - npm --prefix web run build
