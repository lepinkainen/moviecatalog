version: '3'

vars:
  APP_NAME: moviecatalog
  BUILD_DIR: build

tasks:
  build:
    desc: Run lint and tests, build the frontend, then build the binary into build/
    cmds:
      - task: web-build
      - task: lint
      - task: test
      - mkdir -p {{.BUILD_DIR}}
      - go build -o {{.BUILD_DIR}}/{{.APP_NAME}} .

  build-linux:
    desc: Build the Linux binary into build/
    deps: [web-build]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o {{.BUILD_DIR}}/{{.APP_NAME}}-linux-amd64 .

  export:
    desc: Write the read-only library site into site/ (flags after --, e.g. task export -- --title="My discs"; series need TMDB_API_KEY)
    deps: [web-build]
    cmds:
      - go run . export {{.CLI_ARGS}}

  export-op:
    desc: Like export, with TMDB_API_KEY resolved from 1Password (op.env)
    deps: [web-build]
    cmds:
      - op run --env-file=op.env -- go run . export {{.CLI_ARGS}}

  publish:
    desc: Export the site with series lists and upload it to PUBLISH_HOST (both from op.env); export flags go after --
    deps: [web-build]
    cmds:
      - |
        op run --env-file=op.env -- sh -c '
          set -e
          : "${PUBLISH_HOST:?PUBLISH_HOST is not set in op.env}"
          go run . export --output=site/ {{.CLI_ARGS}}
          rsync -avz --delete site/ "$PUBLISH_HOST:/opt/data/caddy/site/movies/"
        '

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  lint:
    desc: Run go vet and the frontend type check
    cmds:
      - go vet ./...
      - npm --prefix web run check

  dev:
    desc: Run the Go server with automatic rebuild and restart on changes (air, API on :8080)
    cmds:
      - mise exec -- air

  dev-op:
    desc: Like dev, with API keys resolved from 1Password (op.env) once at start
    cmds:
      - op run --env-file=op.env -- mise exec -- air

  web-install:
    desc: Install frontend dependencies
    cmds:
      - npm --prefix web install
    sources:
      - web/package.json
      - web/package-lock.json
    generates:
      - web/node_modules/.package-lock.json

  web-dev:
    desc: Run the Vite dev server with live reload (proxies /api to :8080)
    deps: [web-install]
    cmds:
      - npm --prefix web run dev

  web-build:
    desc: Build the frontend into internal/webui/dist for embedding
    deps: [web-install]
    cmds:
      - npm --prefix web run build
