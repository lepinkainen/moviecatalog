# Rebuilds and restarts the Go server when backend code changes (`task dev`).
# The frontend has its own live reload through the Vite dev server (`task web-dev`).
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/moviecatalog ."
entrypoint = ["./tmp/moviecatalog"]
# SQL migrations and the model price list are embedded in the binary, so they need a rebuild too.
include_ext = ["go", "sql", "json"]
exclude_dir = ["web", "build", "data", "tmp", "internal/webui/dist", "internal/webui/export", "site"]
exclude_regex = ["_test\\.go$"]
delay = 500
# Keep the previous build running when the new one does not compile.
stop_on_error = true
# SIGINT lets the server shut down cleanly; an identification cut short by a
# restart is not counted as a failed attempt and is picked up again.
send_interrupt = true
kill_delay = "2s"

[misc]
clean_on_exit = true
